<app-header></app-header>
<div class="d-flex justify-content-between align-items-start container-fluid " style="background-color:#FAFAFA;">
  <app-sidebar></app-sidebar>
  <div class="flex-grow-1 m-3">
    <h3  class="fw-bold main" style="font: size 30px;">المهام والواجبات </h3>
    <p class="main" style="color: #6B7280;font-size: 16px;">جميع المهام والتكليفات المطلوبة منك هذا الفصل الدراسى</p>
    <div class="m-4 p-3 bg-white rounded-3">
      <ul class="nav nav-tabs">
        <li class="nav-item">
          <button class="nav-link active" aria-current="page" data-bs-toggle="pill" data-bs-target="#tasksContent" type="button">المهام المعلقة </button>
        </li>
        <li class="nav-item">
          <button class="nav-link" data-bs-toggle="pill" data-bs-target="#tasksDone" type="button">المهام المكتملة</button>
        </li>
      </ul>
      <div class="tab-content">
        <div class="tab-pane fade show active" id="tasksContent">
            <div class="task-card  m-3 d-flex justify-content-between align-items-end shadow-sm rounded-3 p-2" style="background-color:#FAFAFA">
              <div class="m-2">
                <h5 class="fw-bold">تاسك تعلم الالة</h5>
                <p class="text-secondary">تعلم الالة  </p>
                <div class="info d-flex justify-content-between ">
                  <div class="date" style="font-size:14px">
                    <span class="text-primary m-1">
                      <i class="fa-regular fa-calendar"></i>
                      5-5-2026
                    </span>
                    <span class="text-warning">
                      <i class="fa-regular fa-clock"></i>
                      11:59 م
                    </span>
                  </div>
                </div>
              </div>
              <button class="btn btn-primary"data-bs-toggle="modal" data-bs-target="#uploadModal">تسليم المهمة</button>
            </div>
        </div>
        <div class="tab-pane fade" id="tasksDone">
            <div class="task-card  m-3 d-flex justify-content-between align-items-center shadow-sm rounded-3 p-2 done" style="background-color:#FAFAFA">
              <div class="m-2">
                <h5 class="fw-bold">حل تمارين الفصل الرابع</h5>
                <p class="text-secondary">أمن المعلومات  </p>
                <div class="info d-flex justify-content-between ">
                  <div class="date" style="font-size:14px">
                    <span class="text-primary m-1">
                      <i class="fa-regular fa-calendar"></i>
                      25-4-2026
                    </span>
                    <span class="text-warning">
                      <i class="fa-regular fa-clock"></i>
                      10:00 ص
                    </span>
                  </div>
                </div>
              </div>
              <div class="">
                <i class="fa-solid fa-circle-check fa-2xl"></i>
              </div>
            </div>
        </div>
      </div>

    </div>
  </div>
</div>
<div class="modal fade" id="uploadModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg rounded-4">
      <div class="modal-header border-0">
        <h5 class="fw-bold">تسليم المهمة</h5>
        <button type="button" class="btn-close ms-0 me-auto" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body text-center p-4">
        <div class="upload-icon mb-3">
            <i class="fa-solid fa-arrow-up-from-bracket fa-2xl m-2"></i>
        </div>
        <p class="text-secondary">يرجى اختيار ملف المهمة لرفعه (PDF, ZIP)</p>
        <input type="file" class="form-control mb-3" placeholder="ختر ملف المهمة">
        <div class="d-flex gap-2">
            <button type="button" class="btn btn-primary w-100 fw-bold py-2 rounded-pill">تأكيد التسليم</button>
            <button type="button" class="btn btn-light w-100 fw-bold py-2 rounded-pill" data-bs-dismiss="modal">إلغاء</button>
        </div>
      </div>
    </div>
  </div>
</div>
<app-footer></app-footer>
